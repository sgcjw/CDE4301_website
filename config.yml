baseURL: "https://sgcjw.github.io/website/" 
title: USV Power Distribution System
theme: PaperMod

enableInlineShortcodes: true
enableRobotsTXT: true

taxonomies:
    tag: tags

menu:
    main:
        - name: Interim Report
          url: interim/
          weight: 2
        - name: Final Report
          url: final/
          weight: 3
        - name: Guides
          url: guides/
          weight: 4
        - name: Configurations
          url: configurations/
          weight: 5


params:
    description: "Documentation of ST Engineering's USV Power Distribution System"
    author: Chen Jiawei
    # googleAnalyticsID: "G-XXXXX"
    DateFormat: "January 2006"
    defaultTheme: light
    hideFooter: false
    disableThemeToggle: true
    ShowShareButtons: false
    ShowReadingTime: false
    disableSpecial1stPost: true
    disableAnchoredHeadings: false
    ShowPostNavLinks: true
    ShowBreadCrumbs: true
    ShowCodeCopyButtons: true
    ShowAllPagesInArchive: false
    MainSections: ["interim report", "final report", "guides", "configurations"]
    ShowToc: true
    disableScrollToTop: true
    TocOpen: true
    TocSide: left
    UseHugoToc: true
    ShowWordCount: false
    comments: false
    math: true
    profileMode:
          enabled: true
          title: USV Power Distribution System
          subtitle: "This Power Distribution System is designed and tested for ST Engineering's Unmanned Surface Vehicle (USV)"
          imageWidth: 160
          imageHeight: 160
          buttons:
            - name: Interim Report
              url: interim/
            - name: Final Report
              url: final/
            - name: Guides
              url: guides/
            - name: Configurations
              url: configurations/


    # socialIcons:
    #     - name: GitHub
    #       url: https://github.com/pmichaillat


    assets:
        disableScrollBarStyle: true
    cover:
        hiddenInList: false
        hiddenInSingle: true
    label:
      text: "USV Power Distribution System"
      icon: favicon.ico
      iconHeight: 18

markup:
    goldmark:
        renderer:
            unsafe: true
    highlight:
        guessSyntax: true
        style: autumn 
    tableOfContents:
        endLevel: 3
        ordered: false
        startLevel: 2